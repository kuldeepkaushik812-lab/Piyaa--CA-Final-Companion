name: Build and Release Piyaa Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bring Files to Root Directory
        shell: pwsh
        run: |
          $subfolder = Get-ChildItem -Directory | Where-Object { $_.Name -ne '.github' } | Select-Object -First 1
          if ($subfolder -and (Test-Path "$($subfolder.FullName)\package.json")) {
              Write-Host "Moving files from $($subfolder.Name) to root..."
              Move-Item "$($subfolder.FullName)\*" . -Force
              Remove-Item $subfolder.FullName -Recurse -Force
          }

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { Remove-Item -Force package-lock.json }
          if (Test-Path "bun.lock") { Remove-Item -Force bun.lock }
          npm install

      - name: Create secret .env file
        shell: bash
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Build Web Application
        run: npm run build

      - name: Build and Publish Windows App (.exe)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
