name: Build and Release Piyaa App

on:
  workflow_dispatch: 

jobs:
  build-and-release:
    runs-on: windows-latest 
    defaults:
      run:
        working-directory: ./Piyaa--CA-Final-Companion

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean Install Dependencies
        run: |
          npm cache clean --force
          npm install --force

      - name: Create secret .env file
        shell: bash
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Build the Code
        run: npm run build

      - name: Build and Publish to GitHub Releases
        run: npx electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
