name: Build and Release Piyaa Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bring Files to Root Directory (If in Subfolder)
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            $subfolder = Get-ChildItem -Directory | Where-Object { Test-Path "$($_.FullName)\package.json" } | Select-Object -First 1
            if ($subfolder) {
              Write-Host "Moving files from $($subfolder.Name) to root..."
              Move-Item "$($subfolder.FullName)\*" . -Force
              Remove-Item $subfolder.FullName -Recurse -Force
            }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build and Publish Windows App (.exe)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
